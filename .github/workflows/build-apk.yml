name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "ExpenseTracker-${VERSION}.apk"
          echo "APK_FILE=ExpenseTracker-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-apk
          path: ${{ env.APK_FILE }}

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          generate_release_notes: true

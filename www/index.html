<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f7f6">
    <title>Modern Expense Tracker</title>
    <!-- Chart.js is bundled locally so the app works fully offline -->
    <script src="chart.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --primary: #4361ee;
            --primary-hover: #3a53d0;
            --danger: #e53e3e;
            --danger-hover: #c53030;
            --edit: #f6ad55;
            --edit-hover: #dd6b20;
            --border: #e2e8f0;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --radius: 16px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .top-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 850px) {
            .top-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            animation: fadeIn 0.6s ease-out;
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .month-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .month-selector button {
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-main);
            transition: var(--transition);
        }

        .month-selector button:hover {
            background-color: var(--border);
        }

        .month-selector h3 {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .total-expenses {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .custom-legend {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background-color: var(--bg-color);
            border-radius: 8px;
        }

        .legend-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-main);
            background-color: #fff;
            transition: var(--transition);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
        }

        button.btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (min-width: 650px) {
            .controls {
                grid-template-columns: 2fr 1fr 1fr;
            }
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--bg-color);
            color: var(--text-muted);
            font-weight: 600;
            padding: 14px;
            font-size: 0.9rem;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            color: white;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: white;
            transition: var(--transition);
        }

        .btn-edit { background-color: var(--edit); }
        .btn-edit:hover { background-color: var(--edit-hover); }
        .btn-delete { background-color: var(--danger); }
        .btn-delete:hover { background-color: var(--danger-hover); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes rowAppear {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        tbody tr {
            animation: rowAppear 0.4s ease-out forwards;
        }

        /* ---------- Android / notch safe areas ----------
           Capacitor injects --safe-area-inset-* on Android; env() covers modern WebViews/iOS/browsers.
           In a normal desktop browser both resolve to 0, so nothing changes there. */
        html {
            padding-top: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px));
            padding-right: max(env(safe-area-inset-right, 0px), var(--safe-area-inset-right, 0px));
            padding-bottom: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
            padding-left: max(env(safe-area-inset-left, 0px), var(--safe-area-inset-left, 0px));
            -webkit-text-size-adjust: 100%;
        }
        button, select, input { -webkit-tap-highlight-color: transparent; }

        /* ---------- Responsive additions ---------- */
        img, canvas { max-width: 100%; }
        input[type="date"] { min-height: 46px; -webkit-appearance: none; appearance: none; }
        .month-selector h3 { flex: 1; text-align: center; padding: 0 8px; }
        .history-header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 20px; }
        .history-header h2 { margin-bottom: 0; }
        .history-month { color: var(--text-muted); font-size: 0.95rem; font-weight: 500; }
        .btn-sm { min-height: 34px; }

        @media (min-width: 500px) {
            .custom-legend { grid-template-columns: 1fr 1fr; }
        }

        /* Tablets and below */
        @media (max-width: 849px) {
            body { padding: 16px; }
            .container, .top-row { gap: 18px; }
        }

        /* Phones */
        @media (max-width: 640px) {
            body { padding: 10px; }
            .card { padding: 16px; border-radius: 12px; }
            h2 { font-size: 1.1rem; margin-bottom: 14px; }
            .month-selector { margin-bottom: 14px; padding-bottom: 12px; }
            .month-selector h3 { font-size: 1.05rem; }
            .month-selector button { padding: 8px 10px; font-size: 0.9rem; min-height: 40px; }
            .total-expenses { font-size: 1.6rem; margin-bottom: 14px; }
            .chart-container { height: 220px; }
            .controls { gap: 10px; margin-bottom: 14px; }

            /* Table -> stacked cards */
            .table-responsive { overflow-x: visible; }
            table, thead, tbody, tr, td { display: block; width: 100%; }
            thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
            tbody tr {
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 6px 12px;
                margin-bottom: 12px;
                background: #fff;
            }
            td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                padding: 8px 0;
                border-bottom: 1px dashed var(--border);
                text-align: right;
                word-break: break-word;
            }
            td:last-child { border-bottom: none; }
            td[data-label]::before {
                content: attr(data-label);
                flex-shrink: 0;
                font-size: 0.8rem;
                font-weight: 600;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.03em;
                text-align: left;
            }
            td.no-match { display: block; text-align: center; border-bottom: none; }
            td.actions-cell { display: block; padding-top: 10px; }
            .action-btns { width: 100%; }
            .action-btns .btn-sm { flex: 1; padding: 10px 12px; font-size: 0.9rem; min-height: 40px; }
            .empty-state { padding: 28px 12px; }
        }

        @media (max-width: 360px) {
            .month-selector button { padding: 8px; font-size: 0.8rem; }
            .month-selector h3 { font-size: 0.95rem; padding: 0 4px; }
            .total-expenses { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-row">
            <section class="card monthly-overview">
                <div class="month-selector">
                    <button id="prev-month">&larr; Prev</button>
                    <h3 id="current-month-display"></h3>
                    <button id="next-month">Next &rarr;</button>
                </div>
                
                <div class="total-expenses" id="monthly-total">$0.00</div>
                
                <div id="chart-area">
                    <div class="chart-container">
                        <canvas id="expenseChart"></canvas>
                    </div>
                    <div class="custom-legend" id="chart-legend"></div>
                </div>
                
                <div id="overview-empty" class="empty-state" style="display: none;">
                    No expenses recorded for this month.
                </div>
            </section>

            <section class="card add-expense">
                <h2 id="form-title">Add Expense</h2>
                <form id="expense-form">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Health">Health</option>
                            <option value="Education">Education</option>
                            <option value="Travel">Travel</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" inputmode="decimal" min="0.01" step="0.01" placeholder="e.g. 50.00" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description (Optional)</label>
                        <input type="text" id="description" placeholder="e.g. Groceries">
                    </div>

                    <button type="submit" class="btn-primary" id="submit-btn">Add Expense</button>
                </form>
            </section>
        </div>

        <section class="card expense-history">
            <div class="history-header">
                <h2>Expense History</h2>
                <span class="history-month" id="history-month-label"></span>
            </div>
            
            <div class="controls">
                <input type="text" id="search-input" placeholder="Search by description...">
                
                <select id="filter-category">
                    <option value="All">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Health">Health</option>
                    <option value="Education">Education</option>
                    <option value="Travel">Travel</option>
                    <option value="Other">Other</option>
                </select>

                <select id="sort-select">
                    <option value="date-desc">Latest First</option>
                    <option value="date-asc">Oldest First</option>
                    <option value="amount-desc">Highest Amount</option>
                    <option value="amount-asc">Lowest Amount</option>
                    <option value="category-asc">Category (A-Z)</option>
                </select>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body"></tbody>
                </table>
            </div>
            
            <div id="history-empty" class="empty-state" style="display: none;">
                No expenses recorded for this month.
            </div>
        </section>
    </div>

    <script>
        let expenses = JSON.parse(localStorage.getItem('app_expense_data')) || [];
        let editId = null;
        let viewDate = new Date();
        viewDate.setDate(1); 
        let chartObj = null;

        const catColors = {
            'Food': '#FF9800', 'Transport': '#2196F3', 'Shopping': '#9C27B0',
            'Bills': '#F44336', 'Entertainment': '#E91E63', 'Health': '#4CAF50',
            'Education': '#FFEB3B', 'Travel': '#00BCD4', 'Other': '#9E9E9E'
        };

        const form = document.getElementById('expense-form');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const dInput = document.getElementById('date');
        const cInput = document.getElementById('category');
        const aInput = document.getElementById('amount');
        const descInput = document.getElementById('description');
        const tBody = document.getElementById('history-table-body');
        const hEmpty = document.getElementById('history-empty');
        const sInput = document.getElementById('search-input');
        const fCat = document.getElementById('filter-category');
        const sSelect = document.getElementById('sort-select');
        const mDisplay = document.getElementById('current-month-display');
        const mTotal = document.getElementById('monthly-total');
        const cArea = document.getElementById('chart-area');
        const oEmpty = document.getElementById('overview-empty');
        const cLegend = document.getElementById('chart-legend');

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }

        function inViewMonth(x) {
            const [ey, em] = x.date.split('-');
            return parseInt(ey) === viewDate.getFullYear() && parseInt(em) === viewDate.getMonth() + 1;
        }

        function save() {
            localStorage.setItem('app_expense_data', JSON.stringify(expenses));
        }

        form.addEventListener('submit', e => {
            e.preventDefault();
            const d = dInput.value;
            const c = cInput.value;
            const a = parseFloat(aInput.value);
            const desc = descInput.value.trim();

            if (!d || !c || isNaN(a) || a <= 0) return;

            if (editId) {
                const idx = expenses.findIndex(x => x.id === editId);
                if (idx > -1) expenses[idx] = { id: editId, date: d, category: c, amount: a, description: desc };
                editId = null;
            } else {
                expenses.push({ id: Date.now(), date: d, category: c, amount: a, description: desc });
            }

            save();
            const [sy, sm] = d.split('-').map(Number);
            viewDate = new Date(sy, sm - 1, 1);
            resetForm();
            refresh();
        });

        document.getElementById('prev-month').addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() - 1);
            refresh();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() + 1);
            refresh();
        });

        sInput.addEventListener('input', renderTable);
        fCat.addEventListener('change', renderTable);
        sSelect.addEventListener('change', renderTable);

        window.deleteExp = (id) => {
            if (confirm("Are you sure you want to delete this expense?")) {
                expenses = expenses.filter(x => x.id !== id);
                save();
                refresh();
            }
        };

        window.editExp = (id) => {
            const exp = expenses.find(x => x.id === id);
            if (!exp) return;
            editId = id;
            dInput.value = exp.date;
            cInput.value = exp.category;
            aInput.value = exp.amount;
            descInput.value = exp.description;
            formTitle.textContent = "Edit Expense";
            submitBtn.textContent = "Update Expense";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function resetForm() {
            form.reset();
            editId = null;
            formTitle.textContent = "Add Expense";
            submitBtn.textContent = "Add Expense";
            const today = new Date();
            dInput.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        }

        function renderOverview() {
            mDisplay.textContent = viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            const mExps = expenses.filter(inViewMonth);

            if (!mExps.length) {
                cArea.style.display = 'none';
                oEmpty.style.display = 'block';
                mTotal.textContent = "$0.00";
            } else {
                cArea.style.display = 'block';
                oEmpty.style.display = 'none';
                mTotal.textContent = '$' + mExps.reduce((sum, x) => sum + x.amount, 0).toFixed(2);
                renderChart(mExps);
            }
        }

        function renderChart(data) {
            const totals = {};
            data.forEach(x => totals[x.category] = (totals[x.category] || 0) + x.amount);
            
            const labels = Object.keys(totals);
            const vals = Object.values(totals);
            const bg = labels.map(l => catColors[l]);

            cLegend.innerHTML = labels.map((l, i) => `
                <div class="legend-item">
                    <div class="legend-left">
                        <span class="color-dot" style="background-color: ${bg[i]}"></span>
                        <span>${l}</span>
                    </div>
                    <strong>$${vals[i].toFixed(2)}</strong>
                </div>
            `).join('');

            if (chartObj) chartObj.destroy();
            chartObj = new Chart(document.getElementById('expenseChart').getContext('2d'), {
                type: 'pie',
                data: { labels, datasets: [{ data: vals, backgroundColor: bg, borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function renderTable() {
            document.getElementById('history-month-label').textContent =
                viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const monthExpenses = expenses.filter(inViewMonth);
            const tableEl = document.querySelector('table');

            if (!monthExpenses.length) {
                tBody.innerHTML = '';
                tableEl.style.display = 'none';
                hEmpty.style.display = 'block';
                return;
            }

            tableEl.style.display = '';
            hEmpty.style.display = 'none';

            const q = sInput.value.toLowerCase();
            const cFilter = fCat.value;
            const sortMethod = sSelect.value;

            let filtered = monthExpenses.filter(x => {
                const matchQ = (x.description || '').toLowerCase().includes(q);
                const matchC = cFilter === 'All' || x.category === cFilter;
                return matchQ && matchC;
            });

            filtered.sort((a, b) => {
                if (sortMethod === 'date-desc') return new Date(b.date) - new Date(a.date);
                if (sortMethod === 'date-asc') return new Date(a.date) - new Date(b.date);
                if (sortMethod === 'amount-desc') return b.amount - a.amount;
                if (sortMethod === 'amount-asc') return a.amount - b.amount;
                return a.category.localeCompare(b.category);
            });

            if (!filtered.length) {
                tBody.innerHTML = `<tr><td colspan="5" class="no-match" style="text-align:center; color:#718096;">No matches found.</td></tr>`;
                return;
            }

            tBody.innerHTML = filtered.map(x => {
                const [y, m, d] = x.date.split('-');
                const dStr = new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                return `
                    <tr>
                        <td data-label="Date">${dStr}</td>
                        <td data-label="Category"><span class="category-badge" style="background-color: ${catColors[x.category]}">${x.category}</span></td>
                        <td data-label="Description">${x.description ? escapeHtml(x.description) : '--'}</td>
                        <td data-label="Amount" style="font-weight:600">$${x.amount.toFixed(2)}</td>
                        <td class="actions-cell">
                            <div class="action-btns">
                                <button class="btn-sm btn-edit" onclick="editExp(${x.id})">Edit</button>
                                <button class="btn-sm btn-delete" onclick="deleteExp(${x.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function refresh() {
            renderOverview();
            renderTable();
        }

        resetForm();
        refresh();
    </script>
</body>
</html>
